name: Feature request
description: Something you would like TermWorker to do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please check the Roadmap in the README first; your idea may already be planned.
  - type: textarea
    id: task
    attributes:
      label: The task
      description: What are you trying to do, on what kind of device or connection?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you would like TermWorker to handle it.
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: Workarounds or other tools, if any.
