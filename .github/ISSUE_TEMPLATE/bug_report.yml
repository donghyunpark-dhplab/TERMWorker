name: Bug report
description: Something in TermWorker does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Support is best effort.
        **Security problems:** please do not open an issue; see SECURITY.md.
        Remove passwords, private keys and device identifiers (serial numbers, IMEI, MAC addresses) from anything you paste.
  - type: input
    id: version
    attributes:
      label: TermWorker version
      description: Shown in the About window (click the logo in the sidebar).
      placeholder: "0.3.1"
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Installed from
      options:
        - Windows setup (.exe)
        - Linux .deb
        - Linux AppImage
        - Built from source
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 24H2 / Ubuntu 24.04"
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection type
      multiple: true
      options:
        - Serial
        - SSH
        - Telnet
        - Raw TCP
        - Not connection-related
    validations:
      required: true
  - type: input
    id: adapter
    attributes:
      label: USB-serial adapter (serial only)
      description: Chip or VID:PID as shown in the port list, and the baud rate.
      placeholder: "0403:6001, 115200 8N1"
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a serial session ...
        2. ...
  - type: textarea
    id: log
    attributes:
      label: Terminal output or log
      description: A few lines around the problem. A plain-text or timestamped log helps most.
      render: text
